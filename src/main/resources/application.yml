server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/toonlive}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: false   # Migrations managed by game-api

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 400ms
    livereload:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:changeme-at-least-32-chars-long!!}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

# Guards /internal/** — must match game-api's game-server.internal-secret.
internal:
  secret: ${INTERNAL_SECRET:changeme-internal-secret-32-chars!!}
